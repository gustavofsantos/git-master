name: docs-deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/docsite/**"
      - ".github/workflows/docs-deploy.yml"
  # Run by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `make docs-site` stamps the build with `git describe --tags`.
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: tools/docsite/target
          key: docsite-${{ hashFiles('tools/docsite/Cargo.lock') }}
      - run: make docs
      - run: make docs-site
      # Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: tools/docsite
          command: deploy
