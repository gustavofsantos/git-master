name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux_arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: darwin_amd64 }
          - { os: macos-14, target: aarch64-apple-darwin, name: darwin_arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev
      - run: cargo build --release --locked -p gitmaster --target ${{ matrix.target }}
      # No version in the archive name, so releases/latest/download/<name>
      # always resolves. install.sh depends on this.
      - run: |
          scripts/stage-release.sh target/${{ matrix.target }}/release/gitmaster stage "$GITHUB_REF_NAME"
          tar -czf gitmaster_${{ matrix.name }}.tar.gz -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: gitmaster_${{ matrix.name }}
          path: gitmaster_${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum gitmaster_*.tar.gz > checksums.txt
      # A block scalar: in a plain one, the colon after "upgrade" starts a
      # mapping and GitHub rejects the whole file.
      - run: |
          notes='Install or upgrade:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/gustavofsantos/git-master/main/install.sh | sh
          ```'
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --generate-notes --notes "$notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
