[workspace]
resolver = "2"
exclude = ["tools/docsite"]
members = ["crates/gm-schema", "crates/gm-core", "crates/gm-ui", "crates/gm-mcp", "crates/gitmaster"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Checked in CI for the non-GUI crates (see .github/workflows/ci.yml).
rust-version = "1.99"
license = "Apache-2.0"
# The crates are not published to a registry.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-channel = "2"
git2 = "0.20"
proptest = "1"
sha2 = "0.10"
tempfile = "3"
notify = "8.2"
regex = "1"
ignore = "0.4"
glob = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-clojure-orchard = "0.2"
tree-sitter-lua = "0.4"
gpui-component = "=0.5.1"
mlua = { version = "0.11", features = ["luau", "send", "serialize"] }
gm-schema = { path = "crates/gm-schema" }
gm-core = { path = "crates/gm-core" }
gm-ui = { path = "crates/gm-ui" }
gm-mcp = { path = "crates/gm-mcp" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"   # fallible fns return the crate's one documented error type
must_use_candidate = "allow"   # noisy on query helpers
assert_is_empty = "allow"      # assert!(x.is_empty()) reads fine in tests

# Disk use (design/lessons.md "Disk use of the build"): line tables keep file and line in
# backtraces and panics; full debug info for every dependency is what made `target/debug` large.
# Set CARGO_PROFILE_DEV_DEBUG=2 for a session that needs a debugger to see local variables.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
