[package]
name = "spike-script-rhai"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# `metadata` + `internals` together enable Engine::definitions(), the .d.rhai writer.
rhai = { version = "1", features = ["sync", "metadata", "internals"] }
serde_json = "1"

[[bin]]
name = "spike-script-rhai"
path = "src/main.rs"
