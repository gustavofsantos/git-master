# The documentation site generator (docs/README.md). A tool of the repository, not part of
# the app: its own workspace keeps its dependencies (a Markdown parser, a syntax highlighter)
# out of the app's lockfile and build.
[workspace]

[package]
name = "docsite"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
publish = false
description = "Builds the GitMaster documentation website from docs/"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "html", "regex-fancy"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
