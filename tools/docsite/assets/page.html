<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{document_title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{document_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
{{canonical}}<link rel="stylesheet" href="{{root}}assets/style.css">
<script>try{var t=localStorage.getItem("gm-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="topbar">
  <button class="icon-button nav-toggle" type="button" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="{{root}}index.html">
    <img class="logo logo-dark" src="{{root}}assets/logo-dark.svg" alt="" width="28" height="28">
    <img class="logo logo-light" src="{{root}}assets/logo-light.svg" alt="" width="28" height="28">
    <span class="brand-name">GitMaster</span><span class="brand-docs">Docs</span>
  </a>
  <div class="search">
    <input id="search-input" type="search" placeholder="Search the docs" aria-label="Search the documentation" autocomplete="off" spellcheck="false" data-script="{{root}}assets/search-index.js" data-root="{{root}}">
    <kbd class="search-key" aria-hidden="true">/</kbd>
    <div id="search-results" class="search-results" role="listbox" hidden></div>
  </div>
  <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch between light and dark theme">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
  </button>
</header>
<div class="nav-scrim" hidden></div>
<div class="shell">
  <nav id="sidebar" class="sidebar" aria-label="Documentation">
{{nav}}
  </nav>
  <main id="content" class="content" tabindex="-1">
    <article class="doc">
{{crumbs}}      <h1>{{title}}{{badge}}</h1>
{{content}}
    </article>
{{pager}}    <footer class="footer">GitMaster documentation · {{version}}</footer>
  </main>
  <aside class="toc" aria-label="On this page">
{{toc}}
  </aside>
</div>
<script src="{{root}}assets/site.js" defer></script>
</body>
</html>
