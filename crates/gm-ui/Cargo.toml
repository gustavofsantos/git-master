[package]
name = "gm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gm-schema.workspace = true
gm-core.workspace = true
gm-view.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
unicode-width = "0.2"
gpui = "0.2"
ureq = "3"
sha2 = "0.10"

# gpui compiles its Metal shaders at build time with `xcrun metal`, which only
# a full Xcode has. Compiled at startup instead, the Command Line Tools suffice.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2", features = ["runtime_shaders"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
