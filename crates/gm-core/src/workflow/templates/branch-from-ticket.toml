# Create a branch named after a ticket, after you approve the name.
# Edit: replace `ticket-branch-name` in `argv` with your own script. It gets
# the ticket key as its argument and must print the branch name on stdout.
# The approval shows that name before anything is created.
schema = 1
name = "branch-from-ticket"
description = "Create and check out a branch named from a ticket key"

[inputs]
ticket = { type = "string", prompt = "Ticket key" }

[trigger]
on = "manual"

[[state]]
id = "name"
action = "exec"
with = { argv = ["ticket-branch-name", "${inputs.ticket}"] }
on.timeout = "end.failed"

[[state]]
id = "confirm"
action = "approve"
with = { summary = "Create branch ${states.name.output.text}?" }
on.approved = "create"
on.rejected = "end.done"

[[state]]
id = "create"
action = "branch.create"
with = { name = "${states.name.output.text}", checkout = true }
