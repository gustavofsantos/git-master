# Suggest a commit message from the staged diff.
# Edit: replace `llm-cli` in `argv` with the command line of your own LLM
# tool. It reads the staged diff on stdin and must print the message on stdout.
# The prompt is in `argv`; change it to suit your team's commit style.
schema = 1
name = "suggest-commit-message"
description = "Suggest a commit message from the staged diff"

[trigger]
on = "manual"

[[state]]
id = "ask"
action = "exec"
with = { argv = ["llm-cli", "-p", "Write a conventional commit message for this diff. Reply with the message only, as plain text, without code fences."], stdin = "${repo.staged_diff}", timeout = "60s" }
on.done = [
  { if = "len(${states.ask.output.text}) == 0", to = "ask", limit = 2 },
  { to = "suggest" },
]
on.timeout = "end.failed"

[[state]]
id = "suggest"
action = "commit.suggest_message"
with = { message = "${states.ask.output.text}" }
