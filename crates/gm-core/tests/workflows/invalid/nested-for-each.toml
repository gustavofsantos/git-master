# expect: line 17: is a `for_each` inside a `for_each`
schema = 1
name = "nested-for-each"

[trigger]
on = "manual"

[[state]]
id = "roots"
action = "stack.stale"

[[state]]
id = "outer"
for_each = "${states.roots.output.roots}"
as = "root"
states = [
  { id = "inner", for_each = "${root}", as = "leaf", states = [
    { id = "plan", action = "restack.plan", with = { root = "${leaf}" } },
  ] },
]
