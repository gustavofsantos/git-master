schema = 1
name = "block-restack-on-protected"
description = "Block restack when the root is a protected branch"

[trigger]
on = "before.restack"

[[state]]
id = "check"
action = "noop"
on.done = [
  { if = "${trigger.root} == 'main' or ${trigger.root} == 'release'", to = "end.blocked", reason = "Restack on ${trigger.root} is blocked" },
  { to = "end.done" },
]
