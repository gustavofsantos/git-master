[package]
name = "gm-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gm-schema.workspace = true
gm-core.workspace = true
gm-view.workspace = true
async-channel.workspace = true
# The crossterm backend only (D235); crossterm itself is used through `ratatui::crossterm`,
# so its version always matches the one ratatui draws with.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[target.'cfg(unix)'.dependencies]
# Waits for the terminal's answer to the palette query with a deadline (D250).
rustix = { version = "1", features = ["event", "stdio"] }

[dev-dependencies]
tempfile.workspace = true
